{% extends "base.html" %}
{% block title %}{{ "Edit" if record else "Add" }} Record &middot; Vinyl Tracker{% endblock %}
{% block content %}
  <h2>{{ "Edit Record" if record else "Add Record" }}</h2>
  <form method="post" action="{{ action }}" class="record-form">
    <label>Artist *
      <input type="text" name="artist" required value="{{ record.artist if record else '' }}">
    </label>
    <label>Title *
      <input type="text" name="title" required value="{{ record.title if record else '' }}">
    </label>
    <label>Label
      <input type="text" name="label" value="{{ record.label if record else '' }}">
    </label>
    <label>Genre
      <input type="text" name="genre" value="{{ record.genre if record else '' }}">
    </label>
    <label>Pressing year
      <input type="number" name="pressing_year" value="{{ record.pressing_year if record else '' }}">
    </label>
    <label>Media condition
      <select name="condition">
        <option value="">&mdash;</option>
        {% for c in ["Mint (M)", "Near Mint (NM or M-)", "Very Good Plus (VG+)", "Very Good (VG)", "Good Plus (G+)", "Good (G)", "Fair (F)", "Poor (P)"] %}
          <option value="{{ c }}" {% if record and record.condition == c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Sleeve condition
      <select name="sleeve_condition">
        <option value="">&mdash;</option>
        {% for c in ["Mint (M)", "Near Mint (NM or M-)", "Very Good Plus (VG+)", "Very Good (VG)", "Good Plus (G+)", "Good (G)", "Fair (F)", "Poor (P)"] %}
          <option value="{{ c }}" {% if record and record.sleeve_condition == c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Purchase price (USD)
      <input type="number" step="0.01" name="purchase_price" value="{{ record.purchase_price if record else '' }}">
    </label>
    <label>Discogs release ID
      <input type="number" name="discogs_release_id" value="{{ record.discogs_release_id if record else '' }}">
    </label>
    <label>Notes
      <textarea name="notes">{{ record.notes if record else '' }}</textarea>
    </label>
    <div class="form-actions">
      <button type="submit">{{ "Save" if record else "Add Record" }}</button>
      <a class="button-link" href="/">Cancel</a>
    </div>
  </form>
{% endblock %}
